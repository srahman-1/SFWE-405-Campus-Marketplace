<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>UA Campus Marketplace</title>

    <style>
        body {
          margin:0;
          font-family:Arial;
          background:url("campus.jpg") no-repeat center center fixed;
          background-size:cover;
        }

        .header {
          display:flex;
          align-items:center;
          background:#AB0520;
          color:white;
          padding:15px 30px;
          border-bottom:6px solid #0C234B;
        }

        .header img {
          height:70px;
          margin-right:20px;
        }

        .main {
          text-align:center;
          margin-top:120px;
          background:rgba(255,255,255,0.92);
          width:420px;
          padding:40px;
          border-radius:14px;
          margin-left:auto;
          margin-right:auto;
        }

        .btn {
          display:block;
          background:#0C234B;
          color:white;
          text-decoration:none;
          padding:16px;
          margin:15px 0;
          border-radius:10px;
          font-size:18px;
          font-weight:bold;
        }
        .btn:hover { background:#AB0520; }
    </style>
</head>

<body>

<div class="header">
    <img src="ua-logo.png">
    <div>
        <h1>University of Arizona</h1>
        <h2>Campus Marketplace</h2>
    </div>
</div>

<div class="main">
    <a class="btn" href="users.html">Manage Users</a>
    <a class="btn" href="products.html">Manage Products</a>

</html>
