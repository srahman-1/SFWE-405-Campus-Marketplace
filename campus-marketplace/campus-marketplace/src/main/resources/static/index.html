<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Marketplace</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom">
    <div class="container">
      <a class="navbar-brand" href="index.html">Campus Marketplace</a>

      <div class="d-flex gap-2">
        <a class="btn btn-outline-primary btn-sm" data-auth="signed-out" href="login.html">Log In</a>

        <a class="btn btn-primary btn-sm" data-auth="signed-out" href="signup.html">Sign Up</a>

        <a class="btn btn-outline-primary btn-sm position-relative d-none" data-auth="signed-in" href="/cart.html">
          Cart
          <span id="cartCount"
            class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none">0</span>
        </a>

        <a class="btn btn-outline-primary btn-sm d-none" data-auth="signed-in" href="/orders.html">
          Your Orders
        </a>

        <button id="settingsBtn" class="btn btn-outline-secondary btn-sm d-none" data-auth="signed-in" type="button">
          Settings
        </button>

        <button class="btn btn-outline-secondary btn-sm d-none" data-auth="signed-in" data-action="logout"
          type="button">
          Log Out
        </button>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div class="row mb-3">
      <div class="col-12">
        <h1 class="h3 mb-3">Listings</h1>

        <div class="row g-2 align-items-end">
          <div class="col-12 col-md-6 col-lg-4">
            <label for="searchListings" class="form-label">Search listings</label>
            <input id="searchListings" class="form-control" type="search" placeholder="Name or description">
          </div>

          <div class="col-12 col-md-6 col-lg-8 text-md-end">
            <span id="accountNote" class="text-muted">Browse the marketplace or create an account.</span>
          </div>
        </div>
      </div>
    </div>

    <div id="listingsStatus" class="mb-3 text-muted">Loading listings...</div>
    <div id="noListings" class="alert alert-light border d-none">No listings are available yet.</div>
    <div id="listingsGrid" class="row g-4"></div>
  </main>

  <!-- Settings Modal -->
  <div class="modal fade" id="settingsModal" tabindex="-1" aria-labelledby="settingsModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title" id="settingsModalLabel">Account Settings</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <div class="modal-body">
          <h6>Personal Information</h6>

          <div class="mb-3">
            <label for="settingsEmail" class="form-label">Email</label>
            <input id="settingsEmail" class="form-control" type="email" placeholder="Enter new email">
          </div>

          <div class="mb-3">
            <label for="settingsPassword" class="form-label">New Password</label>
            <input id="settingsPassword" class="form-control" type="password" placeholder="Enter new password">
          </div>

          <button id="saveSettingsBtn" class="btn btn-primary w-100" type="button">
            Save Changes
          </button>

          <div id="settingsMessage" class="mt-3 text-muted small"></div>

          <hr>

          <div class="mt-3">
            <h6 class="text-danger">Danger Zone</h6>
            <p class="text-muted small">
              Deleting your account cannot be undone.
            </p>

            <button id="deleteAccountBtn" class="btn btn-danger w-100" type="button">
              Delete Account
            </button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>

</html>
