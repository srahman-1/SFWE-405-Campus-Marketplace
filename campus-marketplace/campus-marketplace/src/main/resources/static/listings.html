<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Marketplace | Listings</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom">
    <div class="container">
      <a class="navbar-brand" href="index.html">Campus Marketplace</a>
      <div class="d-flex gap-2">
        <a class="btn btn-outline-primary btn-sm" data-auth="signed-out" href="login.html">Log In</a>
        <a class="btn btn-primary btn-sm" data-auth="signed-out" href="signup.html">Sign Up</a>
        <a class="btn btn-outline-primary btn-sm position-relative d-none" data-auth="signed-in" href="/cart.html">
          Cart
          <span id="cartCount" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none">0</span>
        </a>
        <a class="btn btn-outline-primary btn-sm d-none" data-auth="signed-in" href="/products.html">Your Listings</a>
        <a class="btn btn-outline-primary btn-sm d-none" data-auth="signed-in" href="/orders.html">Orders & Sales<a>
        <button id="settingsBtn" class="btn btn-outline-secondary btn-sm d-none" data-auth="signed-in" type="button">
          Settings
        </button>
        <button class="btn btn-outline-secondary btn-sm d-none" data-auth="signed-in" data-action="logout" type="button">Log Out</button>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div class="row mb-3">
      <div class="col-12 col-lg-8">
        <h1 class="h3 mb-2">Listings</h1>
        <p class="text-muted mb-0">Browse the products currently available on campus.</p>
      </div>
      <div class="col-12 col-lg-4 text-lg-end mt-3 mt-lg-0">
        <span id="accountNote" class="text-muted">Browse the marketplace or create an account.</span>
      </div>
    </div>

    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <label for="searchListings" class="form-label">Search listings</label>
        <input id="searchListings" class="form-control" type="search" placeholder="Name or description">
      </div>
    </div>

    <div id="listingsStatus" class="mb-3 text-muted">Loading listings...</div>
    <div id="noListings" class="alert alert-light border d-none">No listings are available yet.</div>
    <div id="listingsGrid" class="row g-4"></div>
  </main>

  <div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="editModalLabel">Edit Listing</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Name</label>
            <input id="editName" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label">Description</label>
            <input id="editDescription" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label">Price</label>
            <input id="editPrice" class="form-control" type="number" step="0.01" min="0.01">
          </div>
          <div class="mb-3">
            <label class="form-label">Quantity available</label>
            <input id="editStock" class="form-control" type="number" min="0" step="1">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="editModalSave">Save changes</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-sm">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="deleteModalLabel">Delete Listing</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          Delete <strong id="deleteModalName"></strong>? This cannot be undone.
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-danger" id="deleteModalConfirm">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
