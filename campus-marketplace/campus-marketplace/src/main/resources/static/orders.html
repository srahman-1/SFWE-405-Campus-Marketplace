<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Marketplace | Orders & Sales</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
    <div class="container">
      <a class="navbar-brand" href="index.html">Campus Marketplace</a>

      <div class="d-flex gap-2">
        <a class="btn btn-outline-primary btn-sm" data-auth="signed-out" href="login.html">Log In</a>

        <a class="btn btn-primary btn-sm" data-auth="signed-out" href="signup.html">Sign Up</a>

        <a class="btn btn-outline-primary btn-sm position-relative d-none" data-auth="signed-in" href="/cart.html">
          Cart
          <span id="cartCount"
            class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none">0</span>
        </a>

        <a class="btn btn-outline-primary btn-sm d-none" data-auth="signed-in" href="/products.html">
          Your Listings
        </a>

        <a class="btn btn-outline-primary btn-sm d-none" data-auth="signed-in" href="/orders.html">
          Orders & Sales
        </a>

        <button id="settingsBtn" class="btn btn-outline-secondary btn-sm d-none" data-auth="signed-in" type="button">
          Settings
        </button>

        <button class="btn btn-outline-secondary btn-sm d-none" data-auth="signed-in" data-action="logout"
          type="button">
          Log Out
        </button>
      </div>
    </div>
  </nav>

<main class="container py-5">
    <h1 class="h3 mb-2">Orders & Sales</h1>

    <div id="ordersContent"></div>
</main>

  <!-- Write Review Modal -->
  <div class="modal fade" id="reviewModal" tabindex="-1" aria-labelledby="reviewModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title" id="reviewModalLabel">Write Review</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <div class="modal-body">
          <input type="hidden" id="reviewProductId">
          <input type="hidden" id="reviewOrderId">

          <div class="mb-3">
            <label for="reviewProductName" class="form-label">Product</label>
            <input id="reviewProductName" class="form-control" type="text" readonly>
          </div>

          <div class="mb-3">
            <label for="reviewRating" class="form-label">Rating</label>
            <select id="reviewRating" class="form-select">
              <option value="">Choose rating</option>
              <option value="5">5 stars</option>
              <option value="4">4 stars</option>
              <option value="3">3 stars</option>
              <option value="2">2 stars</option>
              <option value="1">1 star</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="reviewComment" class="form-label">Comment</label>
            <textarea id="reviewComment" class="form-control" rows="4" maxlength="500"
              placeholder="Optional comment, max 500 characters"></textarea>
            <div class="form-text">Maximum 500 characters.</div>
          </div>

          <div id="reviewMessage" class="small text-muted mb-3"></div>

          <button id="submitReviewBtn" class="btn btn-primary w-100" type="button">
            Submit Review
          </button>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>

</html>
