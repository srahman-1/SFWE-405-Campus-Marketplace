<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Marketplace | Your Listings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
<div id="navbar-container"></div>

<main class="container py-5">
    <h1 class="h3 mb-2">Your Listings</h1>

    <div class="row g-4 mb-4">
        <div class="col-12 col-lg-5">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h2 class="h5 mb-3">New Listing</h2>
                    <div class="mb-3">
                        <label for="name" class="form-label">Name</label>
                        <input id="name" class="form-control" placeholder="Textbook">
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <input id="description" class="form-control" placeholder="Condition, edition, notes">
                    </div>
                    <div class="mb-3">
                        <label for="price" class="form-label">Price</label>
                        <input id="price" class="form-control" type="number" step="0.01" min="0.01" placeholder="25.00">
                    </div>
                    <div class="mb-4">
                        <label for="stock" class="form-label">Quantity available</label>
                        <input id="stock" class="form-control" type="number" min="0" step="1" placeholder="1">
                    </div>
                    <button class="btn btn-primary w-100" type="button" onclick="createProduct()">Add Product</button>
                </div>
            </div>
        </div>
        <div class="col-12 col-lg-7">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="h5 mb-0">Your Current Listings</h2>
                <button class="btn btn-outline-secondary btn-sm" type="button" onclick="loadMyListings()">Refresh</button>
            </div>
            <div id="myListingsStatus" class="mb-3 text-muted">Loading your listings...</div>
            <div id="noMyListings" class="alert alert-light border d-none">You have not posted any listings yet.</div>
            <div id="myListingsGrid" class="row g-4"></div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="navbar.js"></script>
<script src="app.js"></script>
</body>
</html>
