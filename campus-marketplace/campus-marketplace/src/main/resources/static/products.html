<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Products</title>

    <style>
        body { font-family:Arial; background:#f4f6f8; text-align:center; }
        header { background:#AB0520; color:white; padding:20px; }
        input,button { padding:10px; margin:5px; }
        button { background:#0C234B; color:white; border:none; }


        .backbtn {
            background:#444;
            color:white;
            border:none;
            padding:10px 16px;
            border-radius:8px;
            font-weight:bold;
            margin-top:20px;
            cursor:pointer;
        }
        .backbtn:hover {
            background:#222;
        }
    </style>
</head>

<body>

<header>
    <h2>Campus Marketplace — Products</h2>
</header>

<input id="name" placeholder="Name">
<input id="description" placeholder="Description">
<input id="price" type="number" step="0.01" placeholder="Price">

<br>

<button onclick="createProduct()">Add Product</button>
<button onclick="loadProducts()">Load Products</button>

<ul id="products"></ul>

<script src="app.js"></script>

<br><br>
<button class="backbtn" onclick="window.location.href='index.html'">
    ⬅ Home
</button>

</body>
</html>
