<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
    <div class="container">
      <a class="navbar-brand" href="index.html">Campus Marketplace</a>
      <div class="d-flex gap-2">
        <a class="btn btn-outline-secondary btn-sm" href="index.html">Home</a>
        <a class="btn btn-outline-primary btn-sm" href="listings.html">Listings</a>
        <a class="btn btn-outline-primary btn-sm position-relative d-none" data-auth="signed-in" href="/cart.html">
          Cart
          <span id="cartCount" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none">0</span>
        </a>
        <a class="btn btn-outline-primary btn-sm d-none" data-auth="signed-in" href="/products.html">Your Listings</a>
        <a class="btn btn-outline-primary btn-sm d-none" data-auth="signed-in" href="/orders.html">Orders & Sales</a>
        <a class="btn btn-primary btn-sm" href="login.html">Log In</a>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-5">
        <div class="card shadow-sm mx-auto" style="max-width: 380px;">
          <div class="card-body p-4">
            <h1 class="h3 mb-4 text-center fw-semibold">Create Account</h1>

            <div id="signupAlert" class="alert d-none" hidden></div>

            <form id="signupForm" novalidate>
              <div class="mb-3">
                <label for="signupEmail" class="form-label">Email</label>
                <input id="signupEmail" class="form-control" type="email" placeholder="you@school.edu" required>
              </div>
              <div class="mb-3">
                <label for="signupPassword" class="form-label">Password</label>
                <input id="signupPassword" class="form-control" type="password" placeholder="At least 8 characters" required>
              </div>
              <div class="mb-4">
                <label for="signupConfirmPassword" class="form-label">Confirm password</label>
                <input id="signupConfirmPassword" class="form-control" type="password" placeholder="Re-enter password" required>
              </div>
              <button class="btn btn-primary w-100" type="submit">Register</button>
            </form>

            <div class="text-center mt-3">
              <a id="loginLink" href="login.html">Already have an account? Log in</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
